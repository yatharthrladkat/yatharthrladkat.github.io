    <!-- Client-side Anti-Clickjacking Defense for Static CDNs / GitHub Pages -->
    <script>
      try {
        if (window.top !== window.self) {
          var allowed = ['aistudio.google.com', 'google.com', 'googleusercontent.com', 'run.app', 'yatharthrladkat.github.io', 'localhost', '127.0.0.1'];
          var isPermitted = false;
          try {
            var topHost = window.top.location.hostname;
            isPermitted = allowed.some(function(d) { return topHost === d || topHost.endsWith('.' + d); });
          } catch (e) {
            var ref = document.referrer;
            if (ref) {
              isPermitted = allowed.some(function(d) { return ref.indexOf(d) !== -1; });
            }
          }
          if (!isPermitted) {
            window.top.location = window.self.location;
          }
        }
      } catch (err) {}
    </script>
